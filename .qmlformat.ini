[General]
IndentWidth=4
UseTabs=false
NewlineType=native
SemicolonRule=essential
; 6.11 신규: 속성을 카테고리별로 묶되 정렬은 하지 않는다
; (property / binding / signal / function 순서가 항상 같아진다)
GroupAttributesTogether=true
ObjectsSpacing=true
FunctionsSpacing=true
SingleLineEmptyObjects=true
SortImports=true
NormalizeOrder=false
MaxColumnWidth=100
