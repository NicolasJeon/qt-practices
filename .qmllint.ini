; Qt 6.11 이상의 qmllint 가 필요하다.
; 이 파일의 `=error` 레벨과 StalePropertyRead·ContextProperties·EqualityTypeCoercion·
; Eval·AliasCycle 카테고리는 6.11 에 있고 6.8 에는 없다. 6.8.9 qmllint 는 이 파일을
; 읽지 못하고 --help 만 출력한 채 아무것도 검사하지 않는다(2026-09-30 실측, 6.11.2 에서는 정상).
; 머신에 여러 Qt 가 깔려 있으면 .claude/settings.local.json 의 QT_BIN_DIR 로 6.11 을 지정한다.
[General]
DisableDefaultImports=false
MaxWarnings=-1

[Warnings]
; ── 이건 버그다. 통과시키지 않는다 ──────────────────
; C++ 프로퍼티에 NOTIFY 가 없어 바인딩이 갱신 안 되는 경우 (데모 3)
StalePropertyRead=error
; 존재하지 않는 프로퍼티/타입
MissingProperty=error
MissingType=error
ImportFailure=error
; 타입이 안 맞는 대입
IncompatibleType=error
; 상속 순환
InheritanceCycle=error
AliasCycle=error

; ── 팀 스타일 정책 ────────────────────────────────
; context property 대신 required property / 싱글턴을 쓴다
ContextProperties=error
; deprecated API 금지
Deprecated=error
; == 대신 === (타입 강제 변환 금지)
EqualityTypeCoercion=error
; eval 금지
Eval=error
; var 남용 방지 — 선언 없는 변수
UnqualifiedAccess=warning
